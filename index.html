<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bfe3f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Буквоежка</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="splash" class="screen">
  <div class="splash-inner">
    <img id="splashLogo" class="splash-logo" alt="Буквоежки">
    <button id="splashStart" class="splash-start" type="button">Начать игру</button>
  </div>
</section>

<!-- заглушка под меню (строим следующим этапом). Если #menu уже есть — НЕ дублируй -->
<section id="menu" class="screen hidden"></section>
  
<!-- ЭКРАН ВЫБОРА -->
<section id="picker" class="screen hidden">
  <h1>Буквоежки</h1>
  <p>Выбери слово и собери его из букв</p>
  <div class="word-tiles" id="wordTiles"></div>
</section>

<!-- ИГРОВОЙ ЭКРАН -->
<section id="game" class="screen hidden">
  <div class="topbar">
    <button class="iconbtn" id="btnReplay" title="Повторить слово">🔊</button>
    <button class="iconbtn" id="btnHome" title="К выбору слова">✕</button>
  </div>
  <div class="stage">
    <div class="reward" id="reward"></div>
    <div class="slots" id="slots"></div>
    <div class="syl-layer" id="sylLayer"></div>
    <div class="receiver hidden" id="receiver"></div>
    <div class="scatter" id="scatter"></div>
    <div class="wordhold hidden" id="wordHold"></div>
    <div class="sentence-lesson hidden" id="sentenceLesson" aria-label="Составь предложение">
      <div class="sentence-hint">Помоги слову найти своё место</div>
      <div class="sentence-line"><span class="sentence-gap" id="sentenceGap">АИСТ</span><span>ВЫСОКО</span><span>ЛЕТИТ</span></div>
      <div class="sentence-bird" id="sentenceBird" aria-hidden="true">🐦</div>
      <button class="sentence-tile" id="sentenceTile" type="button">АИСТ</button>
      <div class="sentence-help">Перетащи слово в начало предложения</div>
    </div>
    <button class="arrow arrow-left hidden" id="btnPrev" title="Предыдущее слово">◀</button>
    <button class="arrow arrow-right hidden" id="btnNext" title="Следующее слово">▶</button>
  </div>
</section>

<script src="words.js"></script>
<script src="app.js"></script>
<script src="splash.js"></script>
<script src="menu.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
